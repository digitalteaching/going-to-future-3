<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What’s going to happen? – Unit 2 Station 1, part 3</title>
<style>
@font-face{font-family:"Num";font-weight:400;unicode-range:U+0030-0039;src:local("Avenir Next Medium"),local("AvenirNext-Medium"),local("Segoe UI"),local("SegoeUI"),local("Arial")}
@font-face{font-family:"Num";font-weight:700;unicode-range:U+0030-0039;src:local("Avenir Next Bold"),local("AvenirNext-Bold"),local("Segoe UI Bold"),local("SegoeUI-Bold"),local("Arial Bold"),local("Arial-BoldMT")}
:root{
  --bg:#EEF1F4; --card:#FFFFFF; --ink:#14213D; --muted:#5B6779; --line:#D3DAE2;
  --be:#0A6FC2; --gt:#DC2A1E; --vb:#0B7A3B; --not:#9B1B6E; --wh:#FFB000; --mark:#FFE45C;
  --ok:#0B7A3B; --bad:#C62828;
  --font:"Num","Gill Sans","Gill Sans Nova","Gill Sans MT",Calibri,"Trebuchet MS",sans-serif;
  --hand:"Marker Felt","Bradley Hand","Segoe Print","Comic Sans MS",cursive;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:var(--font);color:var(--ink)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:4px solid var(--wh);outline-offset:2px}
h1,h2,h3,h4,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
mark{background:var(--mark);color:var(--ink);border-radius:8px;padding:0 .16em;font-weight:700}
#deck{position:absolute;left:50%;top:50%;width:1600px;height:900px;background:var(--bg);overflow:hidden;transform:translate(-50%,-50%);transform-origin:center}

/* ---------- top bar: the lesson as a Tube line ---------- */
#bar{position:absolute;left:0;right:0;top:0;height:78px;background:#fff;border-bottom:2px solid var(--line);display:flex;align-items:stretch;z-index:5}
#line{display:flex;padding-left:40px}
.st{position:relative;width:138px;padding:15px 0 0;border:0;background:none;text-align:left;color:var(--muted);font-size:20px}
.st::before{content:"";position:absolute;left:12px;top:23px;width:138px;height:8px;border-radius:4px;background:var(--c);opacity:.22}
.st:last-child::before{display:none}
.st.past::before{opacity:1}
.st .dot{position:relative;z-index:1;display:block;width:24px;height:24px;border-radius:50%;background:#fff;border:6px solid var(--c)}
.st.past .dot{background:var(--c)}
.st.now .dot{background:var(--c);box-shadow:0 0 0 4px #fff,0 0 0 8px var(--c)}
.st .lbl{display:block;margin-top:7px;white-space:nowrap}
.st.now .lbl{color:var(--ink);font-weight:700}
#tools{margin-left:auto;display:flex;align-items:center;gap:10px;padding-right:18px}
#clock{border:0;background:none;font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;min-width:96px;text-align:right;padding:0 6px}
#clock.paused{opacity:.4}
#cnt{font-size:20px;color:var(--muted);min-width:74px;text-align:right;font-variant-numeric:tabular-nums}
.nb{width:50px;height:50px;border-radius:50%;border:2px solid var(--line);background:#fff;font-size:26px;line-height:1;display:grid;place-items:center;color:var(--ink)}
.nb:hover{border-color:var(--ink)}
.nb.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.nb.txt{font-size:20px;font-weight:700}

/* ---------- slide basics ---------- */
#stage{position:absolute;left:0;right:0;top:78px;bottom:0}
.slide{position:absolute;inset:0;padding:30px 56px 34px;display:flex;flex-direction:column;gap:18px;font-size:28px;line-height:1.35;animation:sin .3s ease-out both}
@keyframes sin{from{opacity:0}to{opacity:1}}
h2{font-size:46px;line-height:1.1;font-weight:700}
h2 small{font-size:24px;font-weight:400;color:var(--muted);margin-left:14px;white-space:nowrap}
.lead{color:var(--muted)}
[data-s]{opacity:0;transform:translateY(14px);transition:opacity .4s,transform .4s;pointer-events:none}
[data-s].on{opacity:1;transform:none;pointer-events:auto}
.mini{border:2px solid var(--line);background:#fff;border-radius:99px;padding:3px 16px;font-size:19px;color:var(--muted)}
.mini:hover{border-color:var(--ink);color:var(--ink)}
.concl{background:var(--ink);color:#fff;border-radius:18px;padding:16px 26px;font-size:32px;line-height:1.25}
.concl b{color:var(--mark)}
.task{font-size:28px;line-height:1.3}
.nw{white-space:nowrap}

/* grammar colours: pills and coloured words */
.cap{display:inline-flex;align-items:center;height:var(--caph,64px);padding:0 .55em;border-radius:calc(var(--caph,64px)/2);font-weight:700;color:#fff;white-space:nowrap;font-size:var(--capf,34px);line-height:1}
.cap.s{background:var(--ink)}.cap.be{background:var(--be)}.cap.gt{background:var(--gt)}.cap.vb{background:var(--vb)}.cap.not{background:var(--not)}
.cap.wh{background:var(--wh);color:var(--ink)}
.cap.r{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 3px var(--line)}
.cap.vbo{background:#fff;color:var(--vb);box-shadow:inset 0 0 0 3px var(--vb)}
.c-be{color:var(--be);font-weight:700}.c-gt{color:var(--gt);font-weight:700}.c-vb{color:var(--vb);font-weight:700}.c-not{color:var(--not);font-weight:700}.c-wh{color:#A66F00;font-weight:700}
.hand{font-family:var(--hand);background:#FFF6C9;border-radius:6px;padding:2px 12px;display:inline-block;transform:rotate(-.6deg);font-size:26px;line-height:1.3;box-shadow:2px 3px 0 rgba(20,33,61,.1)}
.yn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;color:#fff;font-weight:700;font-size:22px;flex:none}
.yn.y{background:var(--ok)}.yn.n{background:var(--bad)}
.hbox{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 20px;font-size:24px;line-height:1.35}
.hbox h4{margin:0 0 4px;font-size:25px}
.hbox.star{border-color:var(--wh);background:#FFF8E1}
.report{background:var(--ink);color:#fff;border-radius:18px;padding:14px 26px;font-size:30px;line-height:1.25}
.report b{color:var(--mark)}
.rules{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:27px}
.fing{display:inline-flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:99px;padding:5px 20px 5px 7px}
.fing i{font-style:normal;width:42px;height:42px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}

/* timer */
.frow{display:flex;justify-content:space-between;align-items:center;gap:20px}
.tm{display:inline-flex;align-items:center;gap:14px;background:#fff;border:2px solid var(--line);border-radius:99px;padding:6px 10px 6px 8px;position:relative;overflow:hidden;flex:none}
.tm-go{border:0;background:var(--ink);color:#fff;border-radius:99px;padding:8px 24px;font-size:24px;font-weight:700;min-width:118px}
.tm-t{font-size:38px;font-weight:700;font-variant-numeric:tabular-nums;min-width:108px;text-align:center}
.tm-rs{border:0;background:none;font-size:28px;color:var(--muted);padding:0 10px}
.tm-bar{position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--line)}
.tm-bar i{display:block;height:100%;background:var(--ok);transform-origin:left;transition:transform .3s linear}
.tm.low .tm-t{color:var(--bad)}.tm.low .tm-bar i{background:var(--bad)}
.tm.done{animation:blink .5s 6}
@keyframes blink{50%{background:var(--mark)}}

/* ---------- cover ---------- */
.s-cover{justify-content:center;gap:26px}
.s-cover h1{font-size:98px;line-height:1.02;font-weight:700;max-width:1300px;letter-spacing:-.01em}
.s-cover .where{font-size:28px;color:var(--muted)}
.pline{width:100%;height:auto;display:block;overflow:visible}
.pline text{font-family:var(--font);font-size:27px;fill:var(--ink);text-anchor:middle}
.pl-base{stroke:var(--ink);stroke-opacity:.14;stroke-width:14;stroke-linecap:round}
.pl-dot{fill:#fff;stroke:var(--ink);stroke-width:9}
.cv-train{animation:ride 2.6s cubic-bezier(.5,0,.2,1) .4s both}
@keyframes ride{from{transform:translateX(0)}to{transform:translateX(340px)}}
.agenda{display:flex;gap:16px;align-items:stretch}
.agenda .ag{flex:1;background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px 20px;font-size:27px;line-height:1.25}
.agenda p{font-size:27px;align-self:center;font-weight:700;white-space:nowrap;margin-right:6px}

/* ---------- Verb Beat ---------- */
.s-beat{background:radial-gradient(ellipse at 50% -10%,#2B4172 0%,#14213D 62%);color:#fff;gap:14px;padding-top:22px;padding-bottom:22px}
.vb-top{display:flex;justify-content:space-between;align-items:baseline}
.vb-phase{font-size:44px;font-weight:700;line-height:1.1}
.vb-phase small{font-weight:400;color:#B7C3D6;font-size:27px;margin-left:16px}
.vb-time{font-size:36px;font-weight:700;color:var(--mark);font-variant-numeric:tabular-nums}
.vb-de{text-align:center;color:#C9D3E3;font-size:36px;height:48px;line-height:48px}
.vb-pads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px;flex:1;min-height:0}
.vpad{background:#1D2D52;border:3px solid #34477A;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:14px;text-align:center;min-width:0}
.vpad small{color:#8FA0BE;font-size:22px;letter-spacing:.08em;text-transform:uppercase}
.vpad span{font-weight:700;font-size:124px;line-height:1;white-space:nowrap}
.vpad.hit{background:var(--mark);border-color:var(--mark);color:var(--ink);animation:padhit .35s ease-out both}
.vpad.hit small{color:#6B5A00}
.vpad.q{border-color:var(--mark);color:var(--mark)}
.vpad.q.hit{background:#1D2D52;color:var(--mark);animation:padq .3s ease-out both}
.vpad.q.hit small{color:#8FA0BE}
.vpad.glow{box-shadow:0 0 0 6px rgba(255,228,92,.35),0 0 70px rgba(255,228,92,.4)}
@keyframes padhit{0%{transform:scale(1.09)}100%{transform:scale(1.02)}}
@keyframes padq{0%{transform:scale(1.09)}100%{transform:scale(1)}}
.vb-beats{display:flex;justify-content:center;gap:22px;height:26px;align-items:center}
.vb-beats i{width:22px;height:22px;border-radius:50%;background:#34477A;transition:transform .1s}
.vb-beats i.on{background:var(--mark);transform:scale(1.5)}
.vb-bar{height:8px;background:#34477A;border-radius:4px;overflow:hidden;flex:none}
.vb-bar i{display:block;height:100%;width:0;background:var(--mark);transition:width .4s linear}
.vb-ctrl{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:center;font-size:22px;color:#B7C3D6}
.vb-btn{background:transparent;border:2px solid #5C6F9C;color:#fff;border-radius:99px;padding:5px 18px;font-size:22px;line-height:1.3}
.vb-btn:hover{border-color:var(--mark);color:var(--mark)}
.vb-btn.sel,.vb-btn.sel:hover{background:#fff;border-color:#fff;color:var(--ink);font-weight:700}
.vb-btn.big,.vb-btn.big:hover{background:var(--mark);border-color:var(--mark);color:var(--ink);font-weight:700;font-size:30px;padding:8px 30px;min-width:200px}
.vb-opt{display:inline-flex;gap:8px;align-items:center}
.vb-opt b{min-width:2.2em;text-align:center;color:#fff}
.vb-opt label{display:inline-flex;gap:7px;align-items:center;cursor:pointer}
.vb-opt input{width:22px;height:22px;accent-color:var(--mark)}
.vb-hint{color:#8FA0BE;font-size:20px;text-align:center}
.s-beat.running .vb-opt,.s-beat.running .vb-hint{visibility:hidden}
.vb-editor{position:absolute;inset:0;background:rgba(10,16,34,.94);display:none;place-items:center;padding:24px;z-index:4}
.vb-editor.open{display:grid}
.vb-edbox{background:#1D2D52;border:2px solid #34477A;border-radius:18px;padding:22px 26px;width:900px;display:flex;flex-direction:column;gap:12px;font-size:22px}
.vb-edbox h3{color:var(--mark);font-size:30px;margin:0}
.vb-edbox textarea{width:100%;height:430px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:19px;line-height:1.4;background:#14213D;color:#fff;border:2px solid #34477A;border-radius:10px;padding:12px;resize:none}
.vb-edbtns{display:flex;gap:12px;align-items:center}
.vb-edbtns .sp{flex:1}

/* ---------- the picture: camera, spotlight, pins ---------- */
.cam{position:relative;overflow:hidden;border-radius:18px;background:var(--ink);flex:none;box-shadow:0 5px 0 var(--line)}
.cam-in{position:absolute;left:0;top:0;transform-origin:0 0;transition:transform .9s cubic-bezier(.4,0,.2,1)}
.cam-in img{display:block;width:100%;height:100%;user-select:none;-webkit-user-drag:none}
.spot{position:absolute;border:5px solid var(--mark);border-radius:14px;box-shadow:0 0 0 3000px rgba(20,33,61,.68);opacity:0;pointer-events:none;transition:left .7s cubic-bezier(.4,0,.2,1),top .7s cubic-bezier(.4,0,.2,1),width .7s cubic-bezier(.4,0,.2,1),height .7s cubic-bezier(.4,0,.2,1),opacity .4s}
.spot.on{opacity:1}
.spot-l{position:absolute;left:10px;top:10px;background:var(--mark);color:var(--ink);font-weight:700;font-size:30px;line-height:1;padding:9px 18px;border-radius:99px;white-space:nowrap}
.spot-l mark{background:none;padding:0;text-decoration:underline;text-decoration-thickness:4px;text-underline-offset:5px}
.spot-l:empty{display:none}
.spot-l.r{left:auto;right:10px}
.pin{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:var(--ink);color:#fff;border:4px solid #fff;display:grid;place-items:center;font-size:23px;font-weight:700;line-height:1;padding:0;box-shadow:0 3px 8px rgba(0,0,0,.45);transition:background .3s,box-shadow .3s}
button.pin:hover{background:var(--be)}
.pin.open{background:var(--ok)}
.pin.cur{box-shadow:0 0 0 7px var(--mark),0 3px 8px rgba(0,0,0,.45)}
.cam-over{position:absolute;left:0;right:0;bottom:0;padding:70px 26px 22px;background:linear-gradient(transparent,rgba(20,33,61,.86));display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.cam-over span{background:#fff;border-radius:99px;padding:8px 26px;font-size:34px;font-weight:700}
.pg{display:grid;grid-template-columns:1040px minmax(0,1fr);grid-template-rows:476px minmax(0,1fr);gap:16px 24px;flex:1;min-height:0}
.pg>.cam{grid-column:1;grid-row:1}
.pg>.under{grid-column:1;grid-row:2;min-height:0}
.pg>.side{grid-column:2;grid-row:1/3;display:flex;flex-direction:column;gap:14px;min-height:0}
.capt{background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px 28px;display:flex;flex-direction:column;justify-content:center;gap:8px;height:100%}
.capt .big{font-size:42px;line-height:1.2;font-weight:700}
.capt .big.sm{font-size:31px;line-height:1.5;font-weight:400}
.capt .mid{font-size:29px;line-height:1.3}
.capt .sub{font-size:25px;line-height:1.3;color:var(--muted)}
.capt .sub mark{font-weight:400}
.capt .num{display:inline-grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--ok);color:#fff;font-size:28px;margin-right:14px;vertical-align:middle;position:relative;top:-4px}

/* mini map + phrase list */
.mm{position:relative;background:#fff;border:2px solid var(--line);border-radius:18px;height:176px;flex:none}
.mm-flat,.mm-depth{position:absolute;left:50%;top:50%;width:300px;height:137px;margin:-68px 0 0 -150px;transition:opacity .4s}
.mm-flat{border:4px solid var(--ink);border-radius:8px;overflow:hidden;background:
  linear-gradient(var(--line),var(--line)) 33.3% 0/2px 100% no-repeat,linear-gradient(var(--line),var(--line)) 66.6% 0/2px 100% no-repeat,
  linear-gradient(var(--line),var(--line)) 0 33.3%/100% 2px no-repeat,linear-gradient(var(--line),var(--line)) 0 66.6%/100% 2px no-repeat,#F7F9FB}
.mm-z{position:absolute;background:var(--mark);box-shadow:inset 0 0 0 3px var(--ink);border-radius:4px;opacity:0;transition:left .7s cubic-bezier(.4,0,.2,1),top .7s cubic-bezier(.4,0,.2,1),width .7s cubic-bezier(.4,0,.2,1),height .7s cubic-bezier(.4,0,.2,1),opacity .4s}
.mm-z.on{opacity:1}
.mm-depth{opacity:0;overflow:visible}
.mm.depth .mm-flat{opacity:0}.mm.depth .mm-depth{opacity:1}
.mm-depth polygon{fill:#E6EBF1;stroke:var(--ink);stroke-width:4;stroke-linejoin:round;transition:fill .4s}
.mm-depth text{font-family:var(--font);font-size:21px;font-weight:700;fill:var(--ink);text-anchor:middle}
.mm[data-d="far"] .d-far,.mm[data-d="near"] .d-near{fill:var(--mark)}
.phr{background:#fff;border:2px solid var(--line);border-radius:18px;padding:10px 12px;flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-around}
.phr li{font-size:26px;line-height:1;padding:9px 14px;border-radius:12px;white-space:nowrap;opacity:0;transform:translateX(14px);transition:opacity .4s,transform .4s,background .3s,color .3s}
.phr li.on{opacity:1;transform:none}
.phr li.cur{background:var(--ink);color:#fff}

/* word list */
.wl{display:flex;flex-direction:column;gap:6px;flex:1;min-height:0}
.w{display:grid;grid-template-columns:36px minmax(0,1fr) auto;align-items:center;gap:12px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:0 16px 0 8px;flex:1;min-height:0;font-size:25px;line-height:1;transition:border-color .3s,box-shadow .3s}
.w:hover{border-color:#9AA6B6}
.w .n{width:36px;height:36px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:20px;font-weight:700;transition:background .3s}
.w .en{font-weight:700;color:transparent;border-bottom:3px dashed #B9C3CF;padding-bottom:3px;white-space:nowrap;transition:color .3s,border-color .3s}
.w .ge{color:var(--muted);font-size:20px;opacity:0;white-space:nowrap;transition:opacity .3s}
.w.open{border-color:var(--ok)}.w.open .n{background:var(--ok)}
.w.open .en{color:var(--ink);border-bottom-color:transparent}.w.open .ge{opacity:1}
.w.cur{box-shadow:0 0 0 4px var(--mark)}
.who{background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 16px;display:flex;flex-direction:column;gap:5px;font-size:24px;line-height:1.15}
.who li{display:flex;align-items:center;gap:12px}
.who i{font-style:normal;width:32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:18px;font-weight:700;flex:none}

/* where is it? */
.qcard{background:#fff;border:2px solid var(--line);border-radius:22px;padding:58px 26px 22px;flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:10px;position:relative}
.qcard .ino{position:absolute;left:24px;top:16px;font-size:24px;color:var(--muted)}
.qcard .q1{font-size:38px;color:var(--muted)}
.qcard .q2{font-size:50px;line-height:1.12;font-weight:700}
.ansband{opacity:0;transition:opacity .4s}
.ansband.show{opacity:1}

/* scenes (zoomed picture + text) */
.sc{display:grid;grid-template-columns:620px minmax(0,1fr);gap:34px;flex:1;min-height:0;align-items:center}
.sc-r{display:flex;flex-direction:column;gap:20px;min-width:0}
.mq{font-size:34px;line-height:1.25}
.tiles{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;--caph:66px;--capf:35px}
.sc-who{display:flex;align-items:center;gap:18px;font-size:40px;line-height:1.15;font-weight:700}
.sc-who i{font-style:normal;width:70px;height:70px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:38px;flex:none}
.sc-a{background:#fff;border:2px solid var(--line);border-left:14px solid var(--ok);border-radius:18px;padding:20px 28px;font-size:46px;line-height:1.25;min-height:156px;display:flex;align-items:center}
.sc-a span,.sc-alt span{opacity:0;transform:translateY(10px);transition:opacity .4s,transform .4s}
.sc-a.show span,.sc-alt.show span{opacity:1;transform:none}
.sc-alt{font-size:29px;line-height:1.3;color:var(--muted);min-height:76px}
.sc-alt b{color:var(--ink)}
.jump{display:flex;gap:8px}
.jump button{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:#fff;font-size:22px;font-weight:700;padding:0}
.jump button:hover{border-color:var(--ink)}
.jump button.cur{background:var(--ink);border-color:var(--ink);color:#fff}
.bub{display:grid;grid-template-columns:64px minmax(0,1fr);gap:16px;align-items:start}
.bub i{font-style:normal;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:34px;font-weight:700;background:var(--ink)}
.bub.b i{background:var(--not)}
.bub p{background:#fff;border:2px solid var(--line);border-radius:6px 22px 22px 22px;padding:16px 24px;font-size:40px;line-height:1.25;min-height:132px;display:flex;align-items:center}
.bub p span{transition:opacity .4s}
.bub.b.wait p span{opacity:0}
.bub.b.wait p{border-style:dashed}

/* question machine */
.s-you{gap:20px}
.mach{display:flex;gap:12px;align-items:center;justify-content:center;--caph:96px;--capf:46px;padding:14px 0 4px}
.reel{height:96px;border-radius:48px;overflow:hidden;font-weight:700;font-size:40px;line-height:96px;text-align:center;white-space:nowrap;flex:none}
.reel.v{width:500px;background:var(--vb);color:#fff}
.reel.t{width:340px;background:#fff;color:var(--ink);box-shadow:inset 0 0 0 3px var(--line)}
.reel-in{display:flex;flex-direction:column}
.ri{display:block;height:96px}
.ans2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.an{display:flex;align-items:center;gap:16px;background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px 22px;font-size:36px;line-height:1.2}
.pool{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}
.chp{display:inline-block;border:2px solid var(--line);border-radius:99px;padding:1px 14px;margin:4px 6px 2px 0;font-size:24px;background:#F3F6F9;white-space:nowrap}

/* special event */
.s-event{gap:14px}
.ideas{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.idea{background:#fff;border:2px solid var(--line);border-radius:16px;padding:8px 10px;text-align:center;font-size:23px;line-height:1.2}
.idea i{font-style:normal;display:block;font-size:38px;line-height:1.15}
.brow{display:grid;grid-template-columns:380px auto minmax(0,1fr);gap:16px;align-items:center;margin-top:8px}
.bcol{display:flex;flex-wrap:wrap;gap:7px;--caph:46px;--capf:25px}
.bmid{display:flex;gap:8px;--caph:62px;--capf:32px}
.exq{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.exq p{background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 18px;font-size:26px;line-height:1.3}
.exq p span{color:var(--muted)}

/* finish */
.s-finish{justify-content:center;gap:22px}
.checks{display:flex;flex-direction:column;gap:12px}
.ck{display:flex;align-items:center;gap:20px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px 24px;font-size:34px;line-height:1.2;width:100%}
.ck .bx{width:48px;height:48px;border-radius:12px;border:4px solid var(--ink);display:grid;place-items:center;font-size:34px;font-weight:700;color:transparent;flex:none}
.ck.done{border-color:var(--ok)}
.ck.done .bx{background:var(--ok);border-color:var(--ok);color:#fff}
.exit{background:var(--ink);color:#fff;border-radius:20px;padding:18px 28px;font-size:36px;line-height:1.25}
.exit b{color:var(--mark)}
.hwk{background:#fff;border:2px solid var(--line);border-left:14px solid var(--wh);border-radius:18px;padding:14px 26px;font-size:34px}

/* ---------- overlays ---------- */
#notes{position:absolute;right:0;top:78px;bottom:0;width:480px;background:#14213D;color:#fff;z-index:8;padding:22px 26px;overflow:auto;font-size:21px;line-height:1.4;box-shadow:-20px 0 50px rgba(0,0,0,.35)}
#notes h4{margin:0 0 10px;font-size:20px;color:var(--mark);font-weight:700}
#notes p{margin:0 0 10px}
#notes ul{list-style:disc;padding-left:22px;margin:0 0 10px}
#notes li{margin:3px 0}
#notes b{color:var(--mark)}
#notes .txt{width:100%;border-radius:10px;border:0;padding:10px 14px;color:var(--ink);font-size:22px;margin:8px 0}
#notes .btn{border:0;border-radius:10px;background:var(--wh);color:var(--ink);font-weight:700;padding:10px 20px;font-size:21px}
#menu{position:absolute;inset:78px 0 0 0;background:rgba(238,241,244,.97);z-index:9;padding:26px 50px;overflow:auto;columns:3;column-gap:30px}
#menu .mg{break-inside:avoid;margin-bottom:16px}
#menu h4{margin:0 0 4px;font-size:22px;color:var(--c)}
#menu button{display:block;width:100%;text-align:left;border:0;background:none;font-size:23px;padding:4px 10px;border-radius:8px}
#menu button:hover,#menu button.cur{background:#fff}
#menu .keys{font-size:19px;color:var(--muted);line-height:1.5;margin-top:10px}
#blank{position:absolute;inset:0;background:#000;z-index:30}
.gatebox{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:660px;background:#fff;border-radius:22px;padding:34px 40px;border:2px solid var(--line);font-size:26px}
.gatebox h1{font-size:44px;margin-bottom:6px}
.gatebox .gr{display:flex;gap:12px;margin:18px 0 10px}
.gatebox input{flex:1;min-width:0;border:2px solid var(--line);border-radius:12px;padding:10px 16px;font-size:26px}
.gatebox button{border:0;border-radius:12px;background:var(--ink);color:#fff;font-weight:700;padding:10px 26px;font-size:26px}
.gatebox p{color:var(--muted);font-size:22px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>

const app=document.getElementById('app'),KEY='gtf-pw';
const norm=s=>String(s).toLowerCase().replace(/\s+/g,'');
const b64d=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),c=>c.charCodeAt(0))};
const get=()=>{try{return localStorage.getItem(KEY)||''}catch(e){return ''}},set=v=>{try{localStorage.setItem(KEY,v)}catch(e){}};
async function unlock(pw){try{
  const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(norm(pw)),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(LOCK.s),iterations:LOCK.n,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
  const code=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(LOCK.i)},k,b64d(LOCK.c)));
  app.innerHTML='';const s=document.createElement('script');s.textContent="'use strict';\n"+code;document.body.appendChild(s);return true}catch(e){return false}}
(async function(){
  const m=/^#pw=([^&]+)/.exec(location.hash);
  if(m){let v=m[1];try{v=decodeURIComponent(v)}catch(e){}try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}if(await unlock(v)){set(v);return}}
  const saved=get();if(saved&&await unlock(saved))return;
  app.innerHTML='<div style="position:fixed;inset:0;background:#EEF1F4"><form class="gatebox" id="gf" style="width:min(660px,92vw)"><h1>What’s going to happen?</h1><p>Unit 2, Station 1, part 3. Enter the password from your teacher.</p><div class="gr"><input id="pw" type="password" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Password"><button>Open</button></div><p id="pwmsg">&nbsp;</p></form></div>';
  const i=document.getElementById('pw');
  document.getElementById('gf').onsubmit=async e=>{e.preventDefault();if(await unlock(i.value))set(i.value);else{document.getElementById('pwmsg').textContent=window.crypto&&crypto.subtle?'That is not the password. Try again.':'This browser cannot open the page. Please use Chrome, Edge, Firefox or Safari.';i.select()}};
  i.focus();
})();
})();
</script>
